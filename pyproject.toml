[project]
name = "SciFlawBench"
version = "0.1.0"
description = "Agentic benchmark harness for smolagents across models"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "smolagents[toolkit,openai,litellm]>=1.0",
    "wikipedia-api>=0.6",
    "pydantic>=2.0",
    "sympy>=1.14.0",
    "serpapi>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/tools", "src/agents", "src/models", "src/evaluation"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12.3"

[tool.ruff]
target-version = "py312"
line-length = 120


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (common bugs/gotchas)
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F401"]
"src/core/tasks.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -m 'not live'"
markers = [
  "live: hits a real modle API, costs real tokens, run explicitly with -m live"
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

